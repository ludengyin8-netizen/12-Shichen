name: CI

on:
  push:
    branches: [ main, v3-initial, v3-astronomy, v3-lunar ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Swift packages
        run: swift package resolve
      - name: Run tests
        run: swift test --sanitize=thread
